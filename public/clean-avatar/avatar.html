<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no" />
  <title>自研真人口型</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; }
    #stage { position: relative; width: 100%; height: 100%; overflow: hidden; background: #eadfdc; }
    #avatarVideo, #avatarCanvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
    #avatarVideo { visibility: hidden; }
    #avatarCanvas { display: block; }
    #status { position: absolute; inset: auto 10px 8px; color: rgba(70,45,45,.72); font: 12px/1.3 system-ui; text-align: center; }
  </style>
</head>
<body>
  <main id="stage">
    <video id="avatarVideo" muted playsinline></video>
    <canvas id="avatarCanvas" aria-label="自研真人数字人"></canvas>
    <div id="status">自研口型加载中…</div>
  </main>
  <script type="module" src="runtime.js"></script>
</body>
</html>
