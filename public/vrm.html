<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>露米 · VRM 动漫数字人实验</title>
  <link rel="stylesheet" href="/vrm.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "/vrm/vendor/three/three.module.js",
        "three/addons/": "/vrm/vendor/three/addons/",
        "@pixiv/three-vrm": "/vrm/vendor/three-vrm.module.min.js",
        "@pixiv/three-vrm-animation": "/vrm/vendor/three-vrm-animation.module.min.js"
      }
    }
  </script>
</head>
<body>
  <main class="shell">
    <section class="stage" aria-label="VRM 动漫数字人；拖动旋转，滚轮缩放，右键拖动平移，双击复位">
      <canvas id="avatarCanvas"></canvas>
      <div class="brand"><span id="brandInitial">L</span><strong id="brandName">露米 · VRM</strong></div>
      <div class="stage-status"><i></i><span id="avatarStatus">正在加载动漫人物…</span></div>
      <div class="view-controls" role="group" aria-label="调整人物观看角度">
        <button type="button" data-view-angle="-45" aria-label="人物向左转">左转</button>
        <button type="button" data-view-angle="0" aria-label="人物恢复正面">正面</button>
        <button type="button" data-view-angle="45" aria-label="人物向右转">右转</button>
      </div>
      <div class="expression-label" id="expressionLabel">安静陪伴中</div>
    </section>
    <section class="conversation">
      <header>
        <div><p>ANIME COMPANION LAB</p><h1>自然一点，少动一点</h1></div>
        <div class="header-actions">
          <details class="persona-settings" id="personaSettings">
            <summary>角色设定</summary>
            <form id="personaForm">
              <label>角色预设
                <select id="personaPreset">
                  <option value="warm">温暖好友</option>
                  <option value="lively">元气伙伴</option>
                  <option value="calm">冷静知己</option>
                  <option value="custom">自定义</option>
                </select>
              </label>
              <label>名字<input id="personaName" maxlength="20" required /></label>
              <label>与我的关系<input id="personaRelationship" maxlength="40" required /></label>
              <label>说话风格<textarea id="personaStyle" maxlength="160" rows="3" required></textarea></label>
              <button type="submit">保存角色</button>
            </form>
          </details>
          <a href="/" title="返回真人实验">真人版</a>
        </div>
      </header>
      <div class="principles">
        <span>稳定注视</span><span>低幅表情</span><span>每轮最多一个动作</span>
      </div>
      <div class="looks" role="group" aria-label="选择服饰与发型">
        <button type="button" data-look="classic" class="active"><b>简约</b><small>短发 · 黑白装</small></button>
        <button type="button" data-look="soft"><b>学院日常</b><small>齐肩短发 · 针织开衫</small></button>
        <button type="button" data-look="vivid"><b>暗色潮流</b><small>紫色长发 · 黑粉街头装</small></button>
        <button type="button" data-look="nike1"><b>Nike-chan v1</b><small>AITuber Kit · 经典造型</small></button>
        <button type="button" data-look="nike2"><b>Nike-chan v2</b><small>AITuber Kit · 新版造型</small></button>
      </div>
      <div class="rest-poses" role="group" aria-label="选择默认手部姿势">
        <span>待机手势</span>
        <button type="button" data-rest-pose="natural">自然下垂</button>
        <button type="button" data-rest-pose="touch">指尖轻触</button>
        <button type="button" data-rest-pose="crossed">双臂抱胸</button>
      </div>
      <details class="action-test">
        <summary>动作测试</summary>
        <div role="group" aria-label="直接测试人物动作">
          <button type="button" data-action-preview="wave_approval">挥手</button>
          <button type="button" data-action-preview="clap">鼓掌</button>
          <button type="button" data-action-preview="shy">害羞</button>
          <button type="button" data-action-preview="thinking">思考</button>
          <button type="button" data-action-preview="caring">关心</button>
          <button type="button" data-action-preview="surprise">惊讶</button>
        </div>
      </details>
      <details class="pose-calibration" id="poseCalibration">
        <summary>姿势标定</summary>
        <div class="pose-calibration-panel">
          <div class="calibration-toolbar">
            <label>帧<select id="calibrationFrame"><option value="0">合拢</option><option value="1">张开</option></select></label>
            <button type="button" id="calibrationStart">开始</button>
            <button type="button" id="calibrationStop">停止</button>
          </div>
          <label>骨骼<select id="calibrationBone"></select></label>
          <div class="calibration-axes">
            <label>X°<input type="number" data-calibration-axis="x" min="-180" max="180" step="1" value="0" /></label>
            <label>Y°<input type="number" data-calibration-axis="y" min="-180" max="180" step="1" value="0" /></label>
            <label>Z°<input type="number" data-calibration-axis="z" min="-180" max="180" step="1" value="0" /></label>
          </div>
          <div class="calibration-toolbar"><button type="button" id="calibrationReset">全部归零</button><button type="button" id="calibrationExport">导出 JSON</button></div>
          <textarea id="calibrationOutput" rows="6" readonly placeholder="导出的姿势 JSON 会显示在这里"></textarea>
        </div>
      </details>
      <div class="caption" id="caption" aria-live="polite">点击麦克风开始说话</div>
      <button class="mic" id="micButton" type="button" aria-label="开始语音对话">
        <span class="mic-icon"></span><span class="pulse"></span>
      </button>
      <h2 id="voicePrompt">点击麦克风开始说话</h2>
      <p class="detail" id="detailText">MiniMax 流式回答 · VRMA 自然动作与表情</p>
      <div class="wave" id="wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
    </section>
  </main>
  <script type="module" src="/vrm-app.js?v=20260805-35"></script>
</body>
</html>
